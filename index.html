<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Missing You alotzzzz ieid 💔😭🫀</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
        background: linear-gradient(135deg, #ffd6e7, #d9e7ff, #fff1c7);
    }

    .card {
        width: 90%;
        max-width: 430px;
        padding: 35px 22px;
        border-radius: 28px;
        background: rgba(255,255,255,0.65);
        backdrop-filter: blur(12px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        position: relative;
        z-index: 10;
    }

    .emoji {
        font-size: 65px;
        animation: bounce 1.5s infinite;
    }

    h1 {
        margin: 15px 0;
        font-size: 40px;
        color: #e75480;
    }

    h2 {
        font-size: 24px;
        color: #555;
        margin-bottom: 15px;
    }

    p {
        color: #555;
        font-size: 17px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    button {
        border: none;
        padding: 14px 25px;
        border-radius: 30px;
        background: #e75480;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 6px 15px rgba(231,84,128,0.3);
    }

    button:active {
        transform: scale(0.95);
    }

    .heart {
        position: fixed;
        bottom: -30px;
        font-size: 25px;
        animation: floatUp 5s linear forwards;
        pointer-events: none;
    }

    .confetti {
        position: fixed;
        top: -20px;
        width: 9px;
        height: 9px;
        animation: fall 4s linear forwards;
        pointer-events: none;
        z-index: 20;
    }

    @keyframes bounce {
        0%, 100% {
            transform: translateY(0);
        }
        50% {
            transform: translateY(-12px);
        }
    }

    @keyframes floatUp {
        to {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    @media (max-width: 400px) {
        .card {
            padding: 28px 18px;
        }

        h1 {
            font-size: 34px;
        }

        h2 {
            font-size: 21px;
        }

        p {
            font-size: 15px;
        }
    }
</style>
</head>

<body>

<div class="card">
    <div class="emoji">🥹💗</div>

    <h1>Missing You!</h1>

    <h2>Just wanted to say... 👋</h2>

    <p>
        Things just aren't quite the same without you around.
        Hope you're missing me as well! 😊😭💔
        Sending you lots of love and a big smile! ✨
    </p>

    <button onclick="celebrate()">
        💕 Send Some Love
    </button>
</div>

<script>

function createConfetti() {
    const confetti = document.createElement("div");
    confetti.className = "confetti";

    const colors = [
        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#118ab2",
        "#8338ec"
    ];

    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    confetti.style.animationDuration =
        (Math.random() * 2 + 2) + "s";

    document.body.appendChild(confetti);

    setTimeout(() => confetti.remove(), 4500);
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = ["💗","💖","💕","❤️","✨"][
        Math.floor(Math.random() * 5)
    ];

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration =
        (Math.random() * 2 + 3) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5500);
}

function celebrate() {
    for (let i = 0; i < 80; i++) {
        setTimeout(createConfetti, i * 20);
    }

    for (let i = 0; i < 15; i++) {
        setTimeout(createHeart, i * 100);
    }
}

// Small animation when the page opens
setInterval(createHeart, 700);

</script>

</body>
</html>
